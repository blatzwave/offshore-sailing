<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>openOcean — Instruments</title>
    <style>
      :root {
        --bg: #07090b;
        --pod: #0e1216;
        --edge: #1b2228;
        --label: #5d6b76;
        --value: #e8eef2;
        --wind: #ffb020;
        --live: #4ad07f;
        --sim: #ffb020;
        --dead: #6b757c;
        --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--value);
        font-family: var(--mono);
        -webkit-font-smoothing: antialiased;
      }

      .wrap {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px 16px 48px;
      }

      /* Status bar --------------------------------------------------- */
      header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 8px 16px;
        padding-bottom: 14px;
        border-bottom: 1px solid var(--edge);
        margin-bottom: 14px;
      }

      .vessel {
        font-size: 15px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .vessel small {
        display: block;
        font-size: 10px;
        letter-spacing: 0.24em;
        color: var(--label);
        margin-bottom: 4px;
      }

      .status {
        display: flex;
        align-items: center;
        gap: 16px;
        font-size: 10px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--label);
      }

      .chip {
        display: inline-flex;
        align-items: center;
        gap: 7px;
      }

      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--dead);
      }

      .chip[data-state="live"] .dot {
        background: var(--live);
        box-shadow: 0 0 8px var(--live);
      }
      .chip[data-state="live"] { color: var(--live); }

      .chip[data-state="simulated"] .dot {
        background: var(--sim);
        box-shadow: 0 0 8px var(--sim);
      }
      .chip[data-state="simulated"] { color: var(--sim); }

      /* Instrument grid ---------------------------------------------- */
      .grid {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 10px;
      }

      .pod {
        grid-column: span 2;
        background: var(--pod);
        border: 1px solid var(--edge);
        padding: 18px 20px 20px;
        min-height: 150px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .pod .label {
        font-size: 10px;
        letter-spacing: 0.26em;
        color: var(--label);
        text-transform: uppercase;
      }

      .readout {
        display: flex;
        align-items: baseline;
        gap: 8px;
      }

      .pod .value {
        font-size: clamp(2.8rem, 7.5vw, 4.6rem);
        line-height: 0.95;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.02em;
      }

      .pod .unit {
        font-size: 13px;
        letter-spacing: 0.14em;
        color: var(--label);
        text-transform: uppercase;
      }

      .pod.wind .value {
        color: var(--wind);
      }

      /* Position bar */
      .pod.position {
        grid-column: span 6;
        min-height: 0;
        flex-direction: row;
        align-items: center;
        gap: 40px;
        flex-wrap: wrap;
        padding: 18px 20px;
      }

      .coord .label {
        margin-bottom: 6px;
      }

      .coord .value {
        font-size: clamp(1.3rem, 3vw, 1.9rem);
        font-variant-numeric: tabular-nums;
      }

      /* Controls ------------------------------------------------------ */
      .controls {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 10px;
        margin-top: 26px;
      }

      fieldset {
        grid-column: span 3;
        margin: 0;
        border: 1px solid var(--edge);
        padding: 14px 16px 16px;
      }

      legend {
        font-size: 10px;
        letter-spacing: 0.26em;
        color: var(--label);
        text-transform: uppercase;
        padding: 0 6px;
      }

      .fields {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      label {
        display: flex;
        flex-direction: column;
        gap: 5px;
        font-size: 9px;
        letter-spacing: 0.2em;
        color: var(--label);
        text-transform: uppercase;
      }

      input {
        width: 100%;
        background: #05070a;
        border: 1px solid var(--edge);
        color: var(--value);
        font-family: var(--mono);
        font-size: 15px;
        padding: 9px 10px;
        border-radius: 0;
      }

      input:focus {
        outline: none;
        border-color: var(--wind);
      }

      .fields label {
        flex: 1 1 90px;
      }

      button {
        align-self: flex-end;
        background: transparent;
        border: 1px solid var(--label);
        color: var(--value);
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        padding: 10px 18px;
        cursor: pointer;
      }

      button:hover {
        border-color: var(--wind);
        color: var(--wind);
      }

      .message {
        margin-top: 14px;
        min-height: 16px;
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--label);
      }

      .message[data-kind="error"] {
        color: #ff6b5e;
      }

      @media (max-width: 900px) {
        .grid,
        .controls {
          grid-template-columns: repeat(2, 1fr);
        }
        .pod,
        fieldset {
          grid-column: span 1;
        }
        .pod.position {
          grid-column: span 2;
          gap: 24px;
        }
        fieldset {
          grid-column: span 2;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div class="vessel">
          <small>openOcean</small>
          <span id="boatName">———</span>
        </div>
        <div class="status">
          <span class="chip" id="windChip" data-state="none">
            <span class="dot"></span><span id="windSource">no wind data</span>
          </span>
          <span class="chip" id="linkChip" data-state="none">
            <span class="dot"></span><span id="linkState">connecting</span>
          </span>
        </div>
      </header>

      <div class="grid">
        <div class="pod">
          <span class="label">Boat Speed</span>
          <div class="readout">
            <span class="value" id="bsp">—</span><span class="unit">kts</span>
          </div>
        </div>

        <div class="pod">
          <span class="label">Heading</span>
          <div class="readout">
            <span class="value" id="hdg">—</span><span class="unit">°T</span>
          </div>
        </div>

        <div class="pod wind">
          <span class="label">True Wind Speed</span>
          <div class="readout">
            <span class="value" id="tws">—</span><span class="unit">kts</span>
          </div>
        </div>

        <div class="pod wind">
          <span class="label">True Wind Angle</span>
          <div class="readout">
            <span class="value" id="twa">—</span><span class="unit" id="twaSide">°</span>
          </div>
        </div>

        <div class="pod wind">
          <span class="label">True Wind Direction</span>
          <div class="readout">
            <span class="value" id="twd">—</span><span class="unit">°T</span>
          </div>
        </div>

        <div class="pod">
          <span class="label">Last Fix</span>
          <div class="readout">
            <span class="value" id="fix" style="font-size: clamp(1.6rem, 4vw, 2.6rem)">—</span>
          </div>
        </div>

        <div class="pod position">
          <div class="coord">
            <div class="label">Latitude</div>
            <div class="value" id="lat">—</div>
          </div>
          <div class="coord">
            <div class="label">Longitude</div>
            <div class="value" id="lon">—</div>
          </div>
        </div>
      </div>

      <div class="controls">
        <fieldset>
          <legend>Set Heading</legend>
          <form id="hdgForm" class="fields">
            <label>
              Heading °T
              <input type="number" id="newHDG" min="0" max="360" step="1" required />
            </label>
            <button type="submit">Steer</button>
          </form>
        </fieldset>

        <fieldset>
          <legend>Launch Boat</legend>
          <form id="newForm" class="fields">
            <label>
              Name
              <input type="text" id="boatname" required />
            </label>
            <label>
              Lat
              <input type="number" id="newLat" min="-90" max="90" step="any" required />
            </label>
            <label>
              Lon
              <input type="number" id="newLon" min="-180" max="180" step="any" required />
            </label>
            <button type="submit">Launch</button>
          </form>
        </fieldset>
      </div>

      <div class="message" id="message"></div>
    </div>

    <script>
      const REFRESH_MS = 5000;
      const el = (id) => document.getElementById(id);

      // 48.5 -> "48° 30.000' N", as read off a chartplotter.
      function formatCoord(value, axis) {
        if (!Number.isFinite(value)) return "—";
        const hemi = axis === "lat" ? (value >= 0 ? "N" : "S") : value >= 0 ? "E" : "W";
        const abs = Math.abs(value);
        const deg = Math.floor(abs);
        const min = (abs - deg) * 60;
        const degPad = axis === "lat" ? 2 : 3;
        return `${String(deg).padStart(degPad, "0")}° ${min.toFixed(3).padStart(6, "0")}' ${hemi}`;
      }

      // Instruments show three digits and never read 360.
      const pad3 = (n) => String(Math.round(n)).padStart(3, "0");
      const bearing = (n) => pad3(Math.round(n) % 360);

      function setMessage(text, kind) {
        el("message").textContent = text || "";
        el("message").dataset.kind = kind || "";
      }

      function setLink(state, text) {
        el("linkChip").dataset.state = state;
        el("linkState").textContent = text;
      }

      function render(data) {
        el("boatName").textContent = data.bname || "———";
        el("bsp").textContent = Number(data.bsp).toFixed(1);
        el("hdg").textContent = bearing(data.hdg);
        el("tws").textContent = Number(data.tws).toFixed(1);
        el("twd").textContent = bearing(data.twd);

        // Instruments show the wind angle as a magnitude off the bow plus the side
        // it's blowing from: 45°P is 45 degrees off to port.
        const twa = Number(data.twa);
        el("twa").textContent = pad3(Math.abs(twa));
        el("twaSide").textContent = Math.abs(twa) < 0.5 || Math.abs(twa) > 179.5 ? "°" : twa < 0 ? "°P" : "°S";

        el("lat").textContent = formatCoord(Number(data.lat), "lat");
        el("lon").textContent = formatCoord(Number(data.lon), "lon");
        el("fix").textContent = new Date(data.lastlog).toLocaleTimeString([], {
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
        });

        el("windChip").dataset.state = data.windSource;
        el("windSource").textContent =
          data.windSource === "live" ? "live wind" : data.windSource === "simulated" ? "simulated wind" : "no wind data";

        setLink("live", "receiving");
      }

      async function getBoat() {
        try {
          const response = await fetch("/api");
          if (!response.ok) throw new Error("no boat");
          render(await response.json());
        } catch (error) {
          setLink("none", "no signal");
        }
      }

      async function post(url, payload) {
        const response = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.message || "Request failed");
        return data;
      }

      el("hdgForm").addEventListener("submit", async (ev) => {
        ev.preventDefault();
        try {
          const data = await post("/api", { newHDG: el("newHDG").value });
          render(data);
          setMessage(`Steering ${bearing(data.hdg)}°T — ${Number(data.bsp).toFixed(1)} kts`);
        } catch (error) {
          setMessage(error.message, "error");
        }
      });

      el("newForm").addEventListener("submit", async (ev) => {
        ev.preventDefault();
        try {
          const data = await post("/new", {
            boatname: el("boatname").value,
            newLat: el("newLat").value,
            newLon: el("newLon").value,
          });
          render(data);
          setMessage(`${data.bname} launched`);
        } catch (error) {
          setMessage(error.message, "error");
        }
      });

      getBoat();
      setInterval(getBoat, REFRESH_MS);
    </script>
  </body>
</html>
